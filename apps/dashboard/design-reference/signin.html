-lg":"1rem","gutter-lg":"1.5rem","margin":"1rem","space-sm":"0.5rem","space-xl":"1.5rem"},"fontFamily":{"display-lg-mobile":["Geist"],"headline-sm":["Geist"],"label-sm":["Geist"],"display-lg":["Geist"],"body-sm":["Geist"],"headline-md":["Geist"],"body-md":["Geist"],"label-md":["Geist"],"caption":["Geist"],"headline-lg":["Geist"],"body-lg":["Geist"]},"fontSize":{"display-lg-mobile":["28px",{"lineHeight":"36px","letterSpacing":"-0.02em","fontWeight":"600"}],"headline-sm":["16px",{"lineHeight":"24px","letterSpacing":"-0.01em","fontWeight":"600"}],"label-sm":["12px",{"lineHeight":"16px","letterSpacing":"0.01em","fontWeight":"500"}],"display-lg":["36px",{"lineHeight":"44px","letterSpacing":"-0.03em","fontWeight":"600"}],"body-sm":["13px",{"lineHeight":"18px","letterSpacing":"0em","fontWeight":"400"}],"headline-md":["20px",{"lineHeight":"28px","letterSpacing":"-0.015em","fontWeight":"600"}],"body-md":["14px",{"lineHeight":"20px","letterSpacing":"0em","fontWeight":"400"}],"label-md":["13px",{"lineHeight":"18px","letterSpacing":"0.005em","fontWeight":"500"}],"caption":["12px",{"lineHeight":"16px","letterSpacing":"0.01em","fontWeight":"400"}],"headline-lg":["24px",{"lineHeight":"32px","letterSpacing":"-0.02em","fontWeight":"600"}],"body-lg":["15px",{"lineHeight":"22px","letterSpacing":"-0.005em","fontWeight":"400"}]}}}}</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen"><main class="min-h-screen w-full flex items-center justify-center p-gutter md:p-gutter-lg bg-surface"><div class="flex flex-col w-full items-center justify-center p-margin md:p-margin-lg">
<!-- Minimal Centered Auth Container -->
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl p-8 md:p-10 shadow-sm border border-[#EAEAEC]">
<!-- Brand Header -->
<div class="flex items-center gap-space-sm mb-6">
<div class="w-8 h-8 rounded-lg bg-primary-container flex items-center justify-center text-on-primary shadow-sm">
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
</svg>
</div>
<span class="font-headline-md text-headline-md text-[#111114] tracking-tight font-semibold">Kinetix</span>
</div>
<!-- Title -->
<div class="mb-6">
<h1 class="font-headline-lg text-headline-lg text-[#111114] tracking-tight font-semibold text-left">Welcome back</h1>
</div>
<!-- Authentication Form -->
<form class="flex flex-col gap-5" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-[13px] font-medium text-[#111114]" for="email">Email</label>
<div class="relative">
<input autocomplete="email" class="w-full h-10 px-3.5 bg-surface-container-lowest rounded border border-[#EAEAEC] font-body-md text-[13px] text-[#111114] placeholder:text-[#85858F] placeholder:font-normal focus:outline-none focus:border-[#111114] transition-colors" id="email" name="email" placeholder="name@company.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-[13px] font-medium text-[#111114]" for="password">Password</label>
<a class="font-label-sm text-[13px] text-primary-container hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-10 pl-3.5 pr-10 bg-surface-container-lowest rounded border border-[#EAEAEC] font-body-md text-[13px] text-[#111114] placeholder:text-[#85858F] placeholder:font-normal focus:outline-none focus:border-[#111114] transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 text-[#85858F] hover:text-[#111114] transition-colors focus:outline-none flex items-center" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[18px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Submit Action -->
<div class="pt-2">
<button class="w-full h-10 bg-primary-container text-on-primary rounded font-label-md text-[13px] hover:bg-primary transition-colors flex items-center justify-center font-medium" type="submit">
Sign in
</button>
</div>
</form>
<!-- Footer Meta -->
<div class="mt-8 pt-6 border-t border-[#EAEAEC] text-center">
<p class="font-body-sm text-[13px] text-secondary">
New here? 
<a class="text-primary-container font-label-sm text-[13px] hover:text-primary transition-colors ml-1 font-medium" href="#">Create an account</a>
</p>
</div>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main>

</body></html>
