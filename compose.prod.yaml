name: rove-prod

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: rove-api
    mem_limit: 512m
    init: true
    env_file:
      - apps/api/.env
    ports:
      - "3000:3000"
    networks:
      - private
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: rove-api
    command: ["node", "dist/worker.js"]
    mem_limit: 512m
    init: true
    env_file:
      - apps/api/.env
    environment:
      WORKER_ROLE: general
    networks:
      - private
    stop_grace_period: 20s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  browser-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: browser
    image: rove-browser
    shm_size: "1gb"
    mem_limit: 2g
    cpus: 2
    init: true
    env_file:
      - apps/api/.env
    environment:
      WORKER_ROLE: browser
      WORKER_CONCURRENCY: "1"
    networks:
      - egress
    stop_grace_period: 20s
    restart: unless-stopped

  migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrator
    env_file:
      - apps/api/.env
    networks:
      - private
    restart: "no"

networks:
  private:
  egress:
